name: CI/CD

on:
  push:
    branches: [main, 'audit/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veridicta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install uv==0.11.3 && uv sync --locked --group evaluation --group ingest

      - name: Check static errors
        run: uv run --locked --no-sync ruff check data_ingest demo eval retrievers tools ui workspaces autoeval tests

      - name: Compile Python sources
        run: uv run --locked --no-sync python -m compileall -q data_ingest demo eval retrievers tools ui workspaces autoeval tests

      - name: Run synthetic support demo check
        run: uv run --locked --no-sync python -m demo.support_rag --check

      - name: Validate evaluation contract
        run: uv run --locked --no-sync python -m eval.validate_contract --strict-human-labels

      - name: Validate evaluation consistency
        run: uv run --locked --no-sync python -m eval.validate_consistency

      - name: Run fast regression suite
        run: uv run --locked --no-sync python -m pytest -m "not slow and not benchmark" --maxfail=1 -p no:cacheprovider

      - name: Audit runtime dependencies
        run: uv run --locked --no-sync python -m tools.dependency_audit --lockfile uv.lock --output dependency-audit.json

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json

  package:
    name: Package release artifact
    needs: ci
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="veridicta-${GITHUB_REF_NAME}/" \
            --output="dist/veridicta-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: veridicta-source-${{ github.ref_name }}
          path: dist/veridicta-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
